<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办">
<meta name="format-detection" content="telephone=no">
<title>待办</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
/* 启动错误捕获：万一页面没起来，把原因显示出来，而不是白屏。
   平时不显示，只有真出错才出现。 */
(function () {
  var errs = [];
  function paint() {
    if (!document.body || !errs.length) return;
    var el = document.getElementById("bootErr");
    if (!el) {
      el = document.createElement("div");
      el.id = "bootErr";
      el.className = "boot-err";
      document.body.appendChild(el);
    }
    el.textContent = errs.join("\n");
  }
  window.addEventListener("error", function (e) {
    var where = e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "";
    errs.push("启动出错：" + (e.message || e.type) + where);
    paint();
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    errs.push("启动出错：" + ((r && r.message) || r || "未知原因"));
    paint();
  });
  document.addEventListener("DOMContentLoaded", paint);
  setTimeout(paint, 1600);
})();
</script>
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="tb-left">
      <h1 id="pageTitle">今天</h1>
      <p id="pageSub"></p>
    </div>
    <div class="tb-right">
      <button id="btnSearch" class="ico-btn" title="搜索" aria-label="搜索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabbar">
    <button class="tab on" data-tab="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <span>今天</span>
    </button>
    <button class="tab" data-tab="lists">
      <svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>清单</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>日历</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c0-3.8 3.4-5.8 7.5-5.8s7.5 2 7.5 5.8"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<!-- 底部弹层：任务详情 -->
<div id="sheetWrap" class="hidden">
  <div id="sheetMask"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- 全屏搜索 -->
<div id="searchWrap" class="hidden">
  <div class="search-head">
    <input id="searchInput" type="search" placeholder="搜标题、备注、标签…" autocomplete="off">
    <button id="searchClose" class="ico-btn" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="searchBody" class="search-body"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
